<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="750" xmlns="http://www.w3.org/2000/svg">
  <style>
    .key { fill: #333; stroke: #666; stroke-width: 2; }
    .key-label { fill: white; font-family: monospace; font-size: 12px; text-anchor: middle; }
    .gpio-label { fill: #0af; font-family: monospace; font-size: 10px; text-anchor: middle; }
    .row-line { stroke: #f55; stroke-width: 3; fill: none; }
    .col-line { stroke: #5f5; stroke-width: 2; fill: none; }
    .gnd-line { stroke: #888; stroke-width: 3; fill: none; }
    .title { fill: white; font-family: sans-serif; font-size: 18px; font-weight: bold; }
    .divider { stroke: #ff0; stroke-width: 2; stroke-dasharray: 5,5; }
    .thumb-key { fill: #533; stroke: #866; stroke-width: 2; }
  </style>
  
  <rect width="700" height="750" fill="#1a1a1a"/>
  
  <text x="350" y="28" class="title" text-anchor="middle">Elf 右手 - 背面焊接图</text>
  
  <!-- 中线分隔 -->
  <line x1="350" y1="45" x2="350" y2="420" class="divider"/>
  <text x="270" y="60" fill="#ff0" font-family="monospace" font-size="11">← GP2</text>
  <text x="430" y="60" fill="#ff0" font-family="monospace" font-size="11">GP1 →</text>

  <!-- 物理行0: 只有4键 K3,K2 | K1,K0 (K4,K5不存在) -->
  <rect x="230" y="75" width="55" height="55" class="key" rx="5"/>
  <text x="257" y="98" class="key-label">K3</text>
  <text x="257" y="118" class="gpio-label">GP3</text>
  
  <rect x="365" y="75" width="55" height="55" class="key" rx="5"/>
  <text x="392" y="98" class="key-label">K2</text>
  <text x="392" y="118" class="gpio-label">GP13</text>
  
  <rect x="430" y="75" width="55" height="55" class="key" rx="5"/>
  <text x="457" y="98" class="key-label">K1</text>
  <text x="457" y="118" class="gpio-label">GP8</text>
  
  <rect x="495" y="75" width="55" height="55" class="key" rx="5"/>
  <text x="522" y="98" class="key-label">K0</text>
  <text x="522" y="118" class="gpio-label">GP3</text>

  <!-- 物理行1 -->
  <rect x="100" y="140" width="55" height="55" class="key" rx="5"/>
  <text x="127" y="163" class="key-label">K11</text>
  <text x="127" y="183" class="gpio-label">GP14</text>
  
  <rect x="165" y="140" width="55" height="55" class="key" rx="5"/>
  <text x="192" y="163" class="key-label">K10</text>
  <text x="192" y="183" class="gpio-label">GP9</text>
  
  <rect x="230" y="140" width="55" height="55" class="key" rx="5"/>
  <text x="257" y="163" class="key-label">K9</text>
  <text x="257" y="183" class="gpio-label">GP4</text>
  
  <rect x="365" y="140" width="55" height="55" class="key" rx="5"/>
  <text x="392" y="163" class="key-label">K8</text>
  <text x="392" y="183" class="gpio-label">GP14</text>
  
  <rect x="430" y="140" width="55" height="55" class="key" rx="5"/>
  <text x="457" y="163" class="key-label">K7</text>
  <text x="457" y="183" class="gpio-label">GP9</text>
  
  <rect x="495" y="140" width="55" height="55" class="key" rx="5"/>
  <text x="522" y="163" class="key-label">K6</text>
  <text x="522" y="183" class="gpio-label">GP4</text>

  <!-- 物理行2 -->
  <rect x="100" y="205" width="55" height="55" class="key" rx="5"/>
  <text x="127" y="228" class="key-label">K17</text>
  <text x="127" y="248" class="gpio-label">GP15</text>
  
  <rect x="165" y="205" width="55" height="55" class="key" rx="5"/>
  <text x="192" y="228" class="key-label">K16</text>
  <text x="192" y="248" class="gpio-label">GP10</text>
  
  <rect x="230" y="205" width="55" height="55" class="key" rx="5"/>
  <text x="257" y="228" class="key-label">K15</text>
  <text x="257" y="248" class="gpio-label">GP5</text>
  
  <rect x="365" y="205" width="55" height="55" class="key" rx="5"/>
  <text x="392" y="228" class="key-label">K14</text>
  <text x="392" y="248" class="gpio-label">GP15</text>
  
  <rect x="430" y="205" width="55" height="55" class="key" rx="5"/>
  <text x="457" y="228" class="key-label">K13</text>
  <text x="457" y="248" class="gpio-label">GP10</text>
  
  <rect x="495" y="205" width="55" height="55" class="key" rx="5"/>
  <text x="522" y="228" class="key-label">K12</text>
  <text x="522" y="248" class="gpio-label">GP5</text>

  <!-- 物理行3 -->
  <rect x="100" y="270" width="55" height="55" class="key" rx="5"/>
  <text x="127" y="293" class="key-label">K23</text>
  <text x="127" y="313" class="gpio-label">GP16</text>
  
  <rect x="165" y="270" width="55" height="55" class="key" rx="5"/>
  <text x="192" y="293" class="key-label">K22</text>
  <text x="192" y="313" class="gpio-label">GP11</text>
  
  <rect x="230" y="270" width="55" height="55" class="key" rx="5"/>
  <text x="257" y="293" class="key-label">K21</text>
  <text x="257" y="313" class="gpio-label">GP6</text>
  
  <rect x="365" y="270" width="55" height="55" class="key" rx="5"/>
  <text x="392" y="293" class="key-label">K20</text>
  <text x="392" y="313" class="gpio-label">GP16</text>
  
  <rect x="430" y="270" width="55" height="55" class="key" rx="5"/>
  <text x="457" y="293" class="key-label">K19</text>
  <text x="457" y="313" class="gpio-label">GP11</text>
  
  <rect x="495" y="270" width="55" height="55" class="key" rx="5"/>
  <text x="522" y="293" class="key-label">K18</text>
  <text x="522" y="313" class="gpio-label">GP6</text>

  <!-- 物理行4 -->
  <rect x="100" y="335" width="55" height="55" class="key" rx="5"/>
  <text x="127" y="358" class="key-label">K29</text>
  <text x="127" y="378" class="gpio-label">GP17</text>
  
  <rect x="165" y="335" width="55" height="55" class="key" rx="5"/>
  <text x="192" y="358" class="key-label">K28</text>
  <text x="192" y="378" class="gpio-label">GP12</text>
  
  <rect x="230" y="335" width="55" height="55" class="key" rx="5"/>
  <text x="257" y="358" class="key-label">K27</text>
  <text x="257" y="378" class="gpio-label">GP7</text>
  
  <rect x="365" y="335" width="55" height="55" class="key" rx="5"/>
  <text x="392" y="358" class="key-label">K26</text>
  <text x="392" y="378" class="gpio-label">GP17</text>
  
  <rect x="430" y="335" width="55" height="55" class="key" rx="5"/>
  <text x="457" y="358" class="key-label">K25</text>
  <text x="457" y="378" class="gpio-label">GP12</text>
  
  <rect x="495" y="335" width="55" height="55" class="key" rx="5"/>
  <text x="522" y="358" class="key-label">K24</text>
  <text x="522" y="378" class="gpio-label">GP7</text>

  <!-- 红线 GP2 纵向蛇形：K29↑K11→K10↓K28→K27↑K9→(跳到K3) -->
  <!-- 列1: K29→K11 -->
  <path d="M 127 335 L 127 195" class="row-line"/>
  <!-- 横: K11→K10 -->
  <path d="M 127 167 L 192 167" class="row-line"/>
  <!-- 列2: K10→K28 -->
  <path d="M 192 167 L 192 335" class="row-line"/>
  <!-- 横: K28→K27 -->
  <path d="M 192 362 L 257 362" class="row-line"/>
  <!-- 列3: K27→K3 -->
  <path d="M 257 362 L 257 130" class="row-line"/>
  <text x="257" y="68" fill="#f55" font-family="monospace" font-size="10" text-anchor="middle">GP2</text>

  <!-- 红线 GP1 纵向蛇形：K24↑K6→K7↓K25→K26↑K2 -->
  <!-- 列1: K24→K6 -->
  <path d="M 522 335 L 522 195" class="row-line"/>
  <!-- 横: K6→K7 -->
  <path d="M 522 167 L 457 167" class="row-line"/>
  <!-- 列2: K7→K25 -->
  <path d="M 457 167 L 457 335" class="row-line"/>
  <!-- 横: K25→K26 -->
  <path d="M 457 362 L 392 362" class="row-line"/>
  <!-- 列3: K26→K2 -->
  <path d="M 392 362 L 392 130" class="row-line"/>
  <text x="392" y="68" fill="#f55" font-family="monospace" font-size="10" text-anchor="middle">GP1</text>

  <!-- 绿色列线 错位连接 -->
  <!-- 行0: K3-K0 (只有这一条) -->
  <line x1="257" y1="135" x2="257" y2="138" class="col-line"/>
  <line x1="257" y1="138" x2="522" y2="138" class="col-line"/>
  <line x1="522" y1="138" x2="522" y2="135" class="col-line"/>

  <!-- 行1: K9-K6 -->
  <line x1="257" y1="200" x2="257" y2="203" class="col-line"/>
  <line x1="257" y1="203" x2="522" y2="203" class="col-line"/>
  <line x1="522" y1="203" x2="522" y2="200" class="col-line"/>
  <!-- 行1: K10-K7 -->
  <line x1="192" y1="140" x2="192" y2="133" class="col-line"/>
  <line x1="192" y1="133" x2="457" y2="133" class="col-line"/>
  <line x1="457" y1="133" x2="457" y2="140" class="col-line"/>
  <!-- 行1: K11-K8 -->
  <line x1="127" y1="140" x2="127" y2="123" class="col-line"/>
  <line x1="127" y1="123" x2="392" y2="123" class="col-line"/>
  <line x1="392" y1="123" x2="392" y2="140" class="col-line"/>

  <!-- 行2: K15-K12 -->
  <line x1="257" y1="265" x2="257" y2="268" class="col-line"/>
  <line x1="257" y1="268" x2="522" y2="268" class="col-line"/>
  <line x1="522" y1="268" x2="522" y2="265" class="col-line"/>
  <!-- 行2: K16-K13 -->
  <line x1="192" y1="205" x2="192" y2="198" class="col-line"/>
  <line x1="192" y1="198" x2="457" y2="198" class="col-line"/>
  <line x1="457" y1="198" x2="457" y2="205" class="col-line"/>
  <!-- 行2: K17-K14 -->
  <line x1="127" y1="205" x2="127" y2="188" class="col-line"/>
  <line x1="127" y1="188" x2="392" y2="188" class="col-line"/>
  <line x1="392" y1="188" x2="392" y2="205" class="col-line"/>

  <!-- 行3: K21-K18 -->
  <line x1="257" y1="330" x2="257" y2="333" class="col-line"/>
  <line x1="257" y1="333" x2="522" y2="333" class="col-line"/>
  <line x1="522" y1="333" x2="522" y2="330" class="col-line"/>
  <!-- 行3: K22-K19 -->
  <line x1="192" y1="270" x2="192" y2="263" class="col-line"/>
  <line x1="192" y1="263" x2="457" y2="263" class="col-line"/>
  <line x1="457" y1="263" x2="457" y2="270" class="col-line"/>
  <!-- 行3: K23-K20 -->
  <line x1="127" y1="270" x2="127" y2="253" class="col-line"/>
  <line x1="127" y1="253" x2="392" y2="253" class="col-line"/>
  <line x1="392" y1="253" x2="392" y2="270" class="col-line"/>

  <!-- 行4: K27-K24 -->
  <line x1="257" y1="395" x2="257" y2="398" class="col-line"/>
  <line x1="257" y1="398" x2="522" y2="398" class="col-line"/>
  <line x1="522" y1="398" x2="522" y2="395" class="col-line"/>
  <!-- 行4: K28-K25 -->
  <line x1="192" y1="335" x2="192" y2="328" class="col-line"/>
  <line x1="192" y1="328" x2="457" y2="328" class="col-line"/>
  <line x1="457" y1="328" x2="457" y2="335" class="col-line"/>
  <!-- 行4: K29-K26 -->
  <line x1="127" y1="335" x2="127" y2="318" class="col-line"/>
  <line x1="127" y1="318" x2="392" y2="318" class="col-line"/>
  <line x1="392" y1="318" x2="392" y2="335" class="col-line"/>

  <!-- 拇指区 -->
  <text x="570" y="445" fill="#aaa" font-family="sans-serif" font-size="12" text-anchor="middle">拇指区</text>
  
  <!-- 里侧竖排 -->
  <rect x="505" y="470" width="55" height="50" class="thumb-key" rx="5"/>
  <text x="532" y="492" class="key-label">Fn1</text>
  <text x="532" y="510" class="gpio-label">GP23</text>
  
  <rect x="505" y="530" width="55" height="50" class="thumb-key" rx="5"/>
  <text x="532" y="552" class="key-label">Ctrl</text>
  <text x="532" y="570" class="gpio-label">GP22</text>
  
  <rect x="505" y="590" width="55" height="50" class="thumb-key" rx="5"/>
  <text x="532" y="612" class="key-label">Alt</text>
  <text x="532" y="630" class="gpio-label">GP21</text>

  <!-- 外侧竖排 -->
  <rect x="570" y="470" width="55" height="50" class="thumb-key" rx="5"/>
  <text x="597" y="492" class="key-label">GUI</text>
  <text x="597" y="510" class="gpio-label">GP20</text>
  
  <rect x="570" y="530" width="55" height="50" class="thumb-key" rx="5"/>
  <text x="597" y="552" class="key-label">Shift</text>
  <text x="597" y="570" class="gpio-label">GP19</text>
  
  <rect x="570" y="590" width="55" height="50" class="thumb-key" rx="5"/>
  <text x="597" y="612" class="key-label">C+F8</text>
  <text x="597" y="630" class="gpio-label">GP18</text>

  <!-- GND 串联所有6键 -->
  <path d="M 532 520 L 532 530" class="gnd-line"/>
  <path d="M 532 580 L 532 590" class="gnd-line"/>
  <path d="M 532 640 L 532 660 L 597 660 L 597 640" class="gnd-line"/>
  <path d="M 597 580 L 597 590" class="gnd-line"/>
  <path d="M 597 520 L 597 530" class="gnd-line"/>
  <path d="M 597 470 L 597 460 L 532 460 L 532 470" class="gnd-line"/>
  <text x="567" y="678" fill="#888" font-family="monospace" font-size="11" text-anchor="middle">GND</text>

  <text x="490" y="555" fill="#aaa" font-size="10">里</text>
  <text x="640" y="555" fill="#aaa" font-size="10">外</text>

  <!-- 图例 -->
  <rect x="50" y="470" width="160" height="100" fill="#222" stroke="#444" rx="5"/>
  <text x="130" y="490" fill="#ccc" font-family="monospace" font-size="12" text-anchor="middle">图例</text>
  <line x1="60" y1="510" x2="110" y2="510" class="row-line"/>
  <text x="120" y="514" fill="#ccc" font-family="monospace" font-size="11">GP1/2</text>
  <line x1="60" y1="535" x2="110" y2="535" class="col-line"/>
  <text x="120" y="539" fill="#ccc" font-family="monospace" font-size="11">GP3-17</text>
  <line x1="60" y1="560" x2="110" y2="560" class="gnd-line"/>
  <text x="120" y="564" fill="#ccc" font-family="monospace" font-size="11">GND</text>
</svg>
